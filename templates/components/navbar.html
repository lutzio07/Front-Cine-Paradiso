<header class="site-header">
  <div class="header-inner container">
    <a class="brand" href="/">
      <span class="material-symbols-outlined">videocam</span>
      <span>CINE PARADISO</span>
    </a>

    <nav class="site-nav" aria-label="Navegación principal">
      <a href="/" {% if active|default('') == 'cartelera' %}aria-current="page"{% endif %}>Cartelera</a>
      <a href="/perfil" {% if active|default('') == 'perfil' %}aria-current="page"{% endif %}>Mi perfil y entradas</a>
    </nav>

    <div class="header-actions">
      {% if session.get('id_usuario') %}
        <form action="{{ url_for('auth.vista_logout') }}" method="post" style="display: inline;">
          <button class="btn btn-quiet btn-small" type="submit">Cerrar sesión</button>
        </form>
        <span class="avatar" aria-hidden="true" title="{{ session.get('nombre') }}">
          {{ session.get('nombre', 'U')[0]|upper }}
        </span>
      {% else %}
        <a class="btn btn-quiet btn-small" href="{{ url_for('auth.vista_login') }}">Iniciar sesión</a>
        <span class="avatar" aria-hidden="true">
          <span class="material-symbols-outlined">person</span>
        </span>
      {% endif %}
    </div>

    <details class="mobile-menu">
      <summary aria-label="Abrir menú"><span class="material-symbols-outlined">menu</span></summary>
      <nav aria-label="Navegación móvil">
        <a href="/">Cartelera</a>
        <a href="/perfil">Mi perfil y entradas</a>
        {% if session.get('id_usuario') %}
          <form action="{{ url_for('auth.vista_logout') }}" method="post">
            <button class="btn btn-quiet btn-small btn-full" type="submit" style="justify-content: flex-start; border: 0; padding: 7px;">Cerrar sesión</button>
          </form>
        {% else %}
          <a href="{{ url_for('auth.vista_login') }}">Iniciar sesión</a>
        {% endif %}
      </nav>
    </details>
  </div>
</header>
