<section class="card">
    <div class="card-header">
        <h2>B. Crear Nueva Sala</h2>
    </div>

    <form action="{{ url_for('admin.crear_sala') }}" method="post" class="stack">
        <div class="field">
            <label for="sala-sucursal">Sucursal</label>
            <select class="select" name="id_sucursal" id="sala-sucursal" required>
                <option value="">Seleccionar sucursal</option>
                {% for sucursal in sucursales|default([]) %}
                    <option value="{{ sucursal.id_sucursal }}">{{ sucursal.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="field">
            <label for="sala-nombre">Nombre de la sala</label>
            <input class="input" id="sala-nombre" name="nombre" placeholder="Ej.: Sala 1 - 3D" maxlength="150" required>
        </div>

        <div class="field">
            <label for="sala-capacidad">Capacidad (Asientos)</label>
            <input class="input" id="sala-capacidad" type="number" name="capacidad" min="1" max="200" placeholder="Ej.: 60" required>
        </div>

        <button class="btn btn-primary btn-full" type="submit">
            <span class="material-symbols-outlined">add_box</span>
            Crear sala y generar asientos
        </button>
    </form>
</section>
